[project]
name = "edugen-backend"
version = "0.1.0"
description = "EduGen backend: sinh đề kiểm tra Toán THPT từ ma trận đề bằng RAG"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.161.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    # RAG (rag/)
    "anthropic",
    "google-genai",
    "qdrant-client",
    "pymupdf",
    "pymupdf4llm",
    "python-dotenv",
    "sympy",
    "pypandoc-binary>=1.15",
]

[project.optional-dependencies]
ocr = [
    "marker-pdf>=2.1.0",
]
# bge-m3 embedder for rag/ (pulls torch); unit tests use fakes, only ingest / eval / acceptance need it
embed = [
    "FlagEmbedding",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "acceptance: end-to-end feature test (outer loop)",
    "eval: model-quality test against a golden set (costs time/money)",
]
addopts = "-m 'not acceptance and not eval'"

[tool.ruff]
# Pinned so CI and laptops agree; the version itself is pinned in .github/workflows/ci.yml.
line-length = 120
target-version = "py312"
