# Tóm tắt: bản đồ test theo chức năng (F-##) trong vault Hackathon2026-Doc. Mỗi test thuộc đúng một
# chức năng và một mức (unit / integration / acceptance / eval). Chạy theo bộ: `uv run pytest --suite F-03`;
# xem các bộ: `--list-suites`; theo mức: `-m unit`. Thêm file test mới thì thêm vào đây (tests/test_features_map.py kiểm tra).
#
# Rules
# - Entries are a test file (`tests/x/test_y.py`) or one test (`tests/x/test_y.py::test_name`).
#   The most specific entry wins, so a whole file can sit under one feature and single tests under another.
# - Levels: unit = no network/DB server, fakes only; integration = FastAPI app + SQLite + fake RAG/marker;
#   acceptance = full feature flow with real models (outer TDD loop, `@pytest.mark.acceptance`);
#   eval = model quality vs a threshold on a golden set (`@pytest.mark.eval`).
# - `tasks` / `test_cases` mirror the vault notes (05-tasks/, 06-testing/test-cases/); `pending` lists TC notes
#   with no code test yet.

