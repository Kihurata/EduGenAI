# Tóm tắt: Ma trận đề Toán tốt nghiệp theo Phương án 1 của VIASM (đề xuất, KHÔNG phải ma trận chính thức của Bộ). Dùng làm dữ liệu test kiểm tra tổng số lệnh hỏi, tổng điểm theo mạch (TC-008).
# source: VIASM, Cung Thế Anh, "Vài suy nghĩ về ma trận và cấu trúc của đề thi tốt nghiệp THPT môn Toán", Phương án 1, as summarised in [[Môn Toán]] §2
